name: CI

# Typy i testy — bez bazy danych i bez kontenerów, więc job jest szybki
# i powtarzalny. Migracje stosuje się dopiero przy starcie kontenera API
# (prisma migrate deploy), więc CI ich nie uruchamia.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI tylko czyta repozytorium.
permissions:
  contents: read

jobs:
  test:
    name: Typy i testy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lockfile jest w repo — `npm ci` nie zmienia zależności.
      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      # Regresja podatności w zależnościach produkcyjnych (bez dev —
      # tam ostrzeżenia bywają głośne, a do obrazu nie trafiają).
      # Próg ustawiony na `high`, żeby CI nie blokowały drobiazgi.
      - name: Audyt zależności produkcyjnych
        run: npm audit --omit=dev --audit-level=high

      # `install.sh` i `scripts/release.sh` to jedyny bash w repozytorium.
      # Oba działają dopiero na serwerze użytkownika, więc literówka
      # w składni kosztowałaby godziny diagnostyki. `bash -n` pilnuje
      # składni (bez wykonywania skryptów), shellcheck — typowych błędów
      # logicznych (cytowania, wzorce glob, `&&`/`||`). Reguły polskiej
      # typografii („…”) w komunikatach są wyłączone w `.shellcheckrc`.
      - name: Składnia i shellcheck skryptów
        run: |
          bash -n install.sh scripts/release.sh
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update >/dev/null && sudo apt-get install -y shellcheck
          fi
          shellcheck -S warning install.sh scripts/release.sh

      - name: Wygenerowanie klienta Prisma
        run: npm run prisma:generate

      # Lint łapie to, czego typecheck nie widzi (martwe zmienne,
      # błędy hooków Reacta). 0 błędów jest wymagane; ostrzeżenia
      # są dopuszczone i zapisane w eslint.config.mjs.
      - name: ESLint
        run: npm run lint

      - name: Sprawdzenie typów (api + web)
        run: npm run typecheck

      # tsconfig.test.json włącza do programu testów także
      # apps/web/src/lib/password.ts — test porównuje politykę haseł
      # serwera z interfejsem.
      - name: Testy
        run: npm test

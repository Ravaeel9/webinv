# Rejestr Oprogramowania — konfiguracja serwera Nginx
# Plik montowany jako /etc/nginx/conf.d/default.conf
#
# UWAGA na kontekst: ten plik jest includowany wewnątrz `http`,
# więc NIE WOLNO tu umieszczać dyrektyw z kontekstu głównego
# (worker_rlimit_nofile, user, worker_processes, events) —
# nginx odmówi startu z „directive is not allowed here".
# Te dyrektywy są w nginx/nginx.conf.

# Mapowanie nagłówków X-Forwarded-* z proxy
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Kompresja
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

# ─── API ───────────────────────────────────────────────────────
upstream api_upstream {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Limit rozmiaru ciała żądania (6 MB — import pliku XML z nmap przyjmuje do 5 MB)
    client_max_body_size 6m;

    # ── Nagłówki bezpieczeństwa ───────────────────────────────
    # CSP i reszta są w osobnym pliku — powód w jego nagłówku.
    # Ten `include` powtarzamy w każdym `location` poniżej, który sam
    # używa `add_header`, bo `add_header` w `location` zeruje odziedziczone.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Healthcheck kontenera ─────────────────────────────────
    location = /nginx-health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;

        # API ustawia własne nagłówki bezpieczeństwa (helmet) — m.in. te
        # same, które ustawiamy wyżej dla dokumentu. Bez `proxy_hide_header`
        # klient dostałby dwie identyczne wartości tego samego nagłówka,
        # np. `X-Content-Type-Options` raz z Fastify, raz z nginx.
        # Zostawiamy wersję z API, bo to ona bliżej kodu, który ją ustawia.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSockety (gdybyśmy dodali HMR w produkcyjnym buildzie)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering off;
    }

    # ── Pliki statyczne z hashowanymi nazwami ──────────────────
    # Nazwy plików zawierają hash zawartości, więc zmiana pliku daje
    # nowy adres — cache można trzymać wiecznie.
    #
    # Ustawiamy wyłącznie `add_header`, bez `expires`: `expires` sam
    # doklejał własny nagłówek Cache-Control i klient dostawał go
    # dwa razy (max-age=... oraz public, immutable).
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ── index.html — nigdy nie cache'ujemy ───────────────────
    location = /index.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Ukrycie plików wrażliwych ─────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# Nagłówki bezpieczeństwa — w osobnym pliku, bo `add_header` w bloku
# `location` CAŁKOWICIE zastępuje dziedziczone nagłówki, a nie je
# dokłada. Bez `include` w każdym `location`, który sam używa
# `add_header` (tu: /assets/, /index.html, /nginx-health), CSP i cała
# reszta zniknęłyby właśnie tam, gdzie są najbardziej potrzebne.
#
# Wywoływane z kontekstu `server` lub `location`:
#     include /etc/nginx/snippets/security-headers.conf;
#
# Ścieżka celowo POZA `conf.d/`: `nginx.conf` robi
# `include /etc/nginx/conf.d/*.conf` w kontekście `http`, więc plik
# w `conf.d` wylądowałby w `http` i nakładałby się na wszystkie
# serwery, zamiast być jawnie dołączany tam, gdzie chcemy.
#
# Uwaga: `add_header` nadpisuje wartości tylko wtedy, gdy ta sama
# nazwa nie jest ustawiona niżej w hierarchii. Dlatego poniżej nie ma
# duplikatów z `default.conf`.

# ── CSP ─────────────────────────────────────────────────────────
# Treść dobrana pod faktyczne zasoby aplikacji — sprawdzona, nie skopiowana:
#
# * `script-src 'self'` — build Vite to jeden zewnętrzny skrypt
#   modułowy (`<script type="module" src=...>`), bez inline, bez `eval()`,
#   bez `new Function` (potwierdzone w `apps/web/dist/assets/*.js`).
#   To najważniejsza linia: łamanie XSS nie daje już wykonania skryptu.
#
# * `style-src 'self'` — bez `'unsafe-inline'`. Style ustawiane przez
#   Reacta (`style={{...}}`) idą przez CSSOM (`style.setProperty`,
#   `node_modules/react-dom/cjs/react-dom-client.production.js`),
#   a to zgodnie ze specyfikacją CSP nie podlega `style-src-attr`.
#   Arkusz Tailwanda to zwykły `<link rel="stylesheet">` z tego samego
#   origin. Własnych czcionek nie ładujemy z sieci (tylko nazwy fontów
#   systemowych), więc `font-src 'self'` wystarcza.
#
# * `connect-src 'self'` — całe API jest pod tym samym origin
#   (`/api` proxy przez nginx), więc nic nie musi być dopuszczone
#   na zewnątrz.
#
# * `object-src 'none'` — brak wtyczek, brak plików PDF/Flash.
#
# * `frame-ancestors 'self'` — nowoczesna wersja X-Frame-Options;
#   stary nagłówek zostawiamy dla przeglądarek, które CSP nie obsługują.
#
# * `base-uri 'self'` — atakujący nie podmieni `<base>` i nie
#   przekieruje wszystkich względnych URL-i gdzie indziej.
#
# * `form-action 'self'` — formularze nie wysyłają się nigdzie
#   poza własnym origin.
#
# Świadomie BEZ `upgrade-insecure-requests`: wdrażamy HTTP, a dyrektywa
# przepisywałaby zasoby na https:// i wycięłaby dostęp do wdrożenia.
# Do włączenia razem z TLS (patrz SECURITY.md).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;

add_header X-Frame-Options        "SAMEORIGIN"        always;
add_header X-Content-Type-Options "nosniff"           always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

# `X-XSS-Protection` celowo nie ustawiamy. Dyrektywa jest wycofana —
# przeglądarki ją zignorowały, a tryb `1; mode=block` w XSS auditorach
# sam potrafił wprowadzać w błąd (usuwał treść zamiast ją chronić).
# Ochronę przed XSS daje CSP powyżej.

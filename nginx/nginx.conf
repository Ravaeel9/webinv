# ─────────────────────────────────────────────────────────────
#  Rejestr Oprogramowania — główna konfiguracja Nginx
#  Montowana jako /etc/nginx/nginx.conf
#
#  UWAGA na kontekst: `worker_rlimit_nofile` jest dozwolony
#  TYLKO w kontekście głównym (main). Pliki w conf.d są
#  includowane wewnątrz http, więc dyrektywy `main` muszą
#  zostać tutaj — inaczej nginx odmawia startu.
# ─────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;

# Maksymalna liczba plików deskryptorów na proces roboczy.
# Ważne przy dużym ruchu — bez tego nginx wyczerpie pulę i
# zacznie odrzucać połączenia z „too many open files".
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Odpowiedzi API są małe — nie trzymamy ich w dysku.
    proxy_temp_path /var/cache/nginx/proxy_temp;

    include /etc/nginx/conf.d/*.conf;
}
